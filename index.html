<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // ignore if already defined
        }
      })();
    </script>
